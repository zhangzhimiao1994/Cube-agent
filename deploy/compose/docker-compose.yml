name: agent-hub

services:
  migrate:
    image: ${AGENT_HUB_IMAGE:-agent-hub:latest}
    build:
      context: ../..
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [backend]
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

  bootstrap:
    image: ${AGENT_HUB_IMAGE:-agent-hub:latest}
    env_file:
      - path: .env
        required: false
    command:
      [
        "python",
        "-m",
        "agent_hub.cli.bootstrap",
        "--code-env",
        "AGENT_HUB_SETUP_CODE",
        "--database-url-env",
        "AGENT_HUB_DATABASE_URL",
        "--minutes",
        "60",
      ]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"
    networks: [backend]
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

  api:
    image: ${AGENT_HUB_IMAGE:-agent-hub:latest}
    build:
      context: ../..
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      litellm:
        condition: service_started
    restart: unless-stopped
    networks: [backend, public]
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
      - /run/agent-hub:size=32m,mode=0755
    volumes:
      - agent_hub_data:/var/lib/agent-hub
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "agent-hub-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3

  feishu:
    image: ${AGENT_HUB_IMAGE:-agent-hub:latest}
    env_file:
      - path: .env
        required: false
    command: ["uvicorn", "agent_hub.app:app", "--host", "0.0.0.0", "--port", "8001"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks: [backend]
    read_only: true
    tmpfs: ["/tmp:size=128m,mode=1777"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  worker:
    image: ${AGENT_HUB_IMAGE:-agent-hub:latest}
    env_file:
      - path: .env
        required: false
    command: ["python", "-m", "agent_hub.runtime.worker"]
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    restart: unless-stopped
    networks: [backend]
    read_only: true
    tmpfs: ["/tmp:size=256m,mode=1777"]
    volumes:
      - agent_hub_data:/var/lib/agent-hub
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  litellm:
    image: ${LITELLM_IMAGE:-ghcr.io/berriai/litellm:main-stable}
    env_file:
      - path: .env
        required: false
    command: ["--port", "4000", "--host", "0.0.0.0"]
    restart: unless-stopped
    networks: [backend]
    security_opt: ["no-new-privileges:true"]

  skill-runner:
    image: ${AGENT_HUB_IMAGE:-agent-hub:latest}
    env_file:
      - path: .env
        required: false
    command: ["python", "-m", "agent_hub.skills.runner"]
    restart: unless-stopped
    networks: [skills]
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
      - /workspace:size=512m,mode=0700
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    networks: [backend]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped
    networks: [backend]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  caddy:
    image: ${CADDY_IMAGE:-caddy:2-alpine}
    env_file:
      - path: .env
        required: false
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    restart: unless-stopped
    networks: [public]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

networks:
  public:
  backend:
    internal: true
  skills:
    internal: true

volumes:
  agent_hub_data:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
