[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-hub"
version = "0.1.0"
description = "Agent Hub backend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.16,<2",
    "argon2-cffi>=23.1,<26",
    "asyncpg>=0.30,<1",
    "cryptography>=45,<47",
    # Upgrade only after the Crew adapter contract and integration suites pass.
    "crewai==1.15.11",
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "openai>=2,<3",
    "pillow>=12.3,<13",
    "pydantic-settings>=2.10,<3",
    "pyjwt[crypto]>=2.10,<3",
    "pyyaml>=6,<7",
    "redis>=6,<7",
    "sqlalchemy[asyncio]>=2.0.41,<3",
    "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
    "mypy>=1.17,<2",
    "pytest>=8.4,<9",
    "pytest-asyncio>=1,<2",
    "ruff>=0.12,<1",
    "types-pyyaml>=6,<7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests that require external integration services",
]

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true
python_version = "3.12"
