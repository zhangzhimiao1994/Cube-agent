name: quality

on:
  push:
  pull_request:

jobs:
  python-web-shell:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run mypy --strict --platform linux src tests
      - run: uv run mypy --strict --platform win32 src tests
      - name: Configure Docker Hub cache on hosted runner
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_ACTIONS:-}" != "true" || "${RUNNER_ENVIRONMENT:-}" != "github-hosted" ]]; then
            printf 'Docker Hub cache setup requires an ephemeral GitHub-hosted runner\n' >&2
            exit 1
          fi
          sudo python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("/etc/docker/daemon.json")
          config = json.loads(path.read_text(encoding="utf-8")) if path.exists() else {}
          if not isinstance(config, dict):
              raise ValueError("invalid Docker daemon configuration")
          mirrors = config.get("registry-mirrors", [])
          if not isinstance(mirrors, list) or any(not isinstance(mirror, str) for mirror in mirrors):
              raise ValueError("invalid Docker daemon mirrors")
          if not any(mirror.rstrip("/") == "https://mirror.gcr.io" for mirror in mirrors):
              mirrors = ["https://mirror.gcr.io", *mirrors]
          config["registry-mirrors"] = mirrors
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(config, indent=2) + "\n", encoding="utf-8")
          PY
          sudo systemctl restart docker
          docker info --format '{{json .RegistryConfig.Mirrors}}' | python3 -c 'import json, sys; mirrors = json.load(sys.stdin); sys.exit(0 if isinstance(mirrors, list) and all(isinstance(mirror, str) for mirror in mirrors) and any(mirror.rstrip("/") == "https://mirror.gcr.io" for mirror in mirrors) else "Docker Hub mirror not active")'
      - run: docker compose -f tests/compose.yml up -d --wait
      - name: Run uv run pytest -q
        shell: bash
        run: |
          set +e
          uv run pytest -q --tb=short --disable-warnings 2>&1 | tee pytest-output.txt
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            python - <<'PY'
          import re
          from pathlib import Path

          output = Path("pytest-output.txt").read_text(encoding="utf-8", errors="replace")
          emitted = 0
          failure_sections = {
              match.group("nodeid"): match.group("body").strip()[:3500]
              for match in re.finditer(
                  r"^_{3,}\s+(?P<nodeid>tests/[^\s]+)\s+_{3,}\n(?P<body>.*?)(?=^_{3,}\s+tests/|\n=+ short test summary info =+|\Z)",
                  output,
                  re.MULTILINE | re.DOTALL,
              )
          }
          patterns = (
              re.compile(r"^(FAILED|ERROR) (?P<nodeid>tests/[^\s:]+(?:::[^\s]+)*)", re.MULTILINE),
              re.compile(r"^_{3,}\s+(?P<nodeid>tests/[^\s]+)\s+_{3,}$", re.MULTILINE),
          )
          for pattern in patterns:
              for match in pattern.finditer(output):
                  nodeid = match.group("nodeid")
                  path = nodeid.split("::", 1)[0]
                  detail = failure_sections.get(nodeid, nodeid)
                  detail = detail.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                  print(f"::error file={path},title=pytest failure::{detail}")
                  emitted += 1
                  if emitted >= 20:
                      raise SystemExit
          if emitted == 0:
              print("::error title=pytest failure::uv run pytest -q failed; raw job logs are required for full traceback")
          PY
          fi
          exit "$status"
      - if: always()
        run: docker compose -f tests/compose.yml down -v --remove-orphans
      - run: npm ci
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm run test -- --run
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: Install browser for opaque preview contract
        run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Verify preview HTTP interaction and responsive layout
        run: node --test e2e/preview-fetch-bridge.cjs e2e/website-preview-layout.cjs e2e/collect-case-browser-evidence.test.cjs
        working-directory: web
      - name: Install shell test tools
        shell: bash
        run: |
          set -euo pipefail
          shellcheck --version
          npm install -g bats
          bats -v
      - run: bash -n install.sh scripts/agent-hub scripts/lib/*.sh scripts/commands/*.sh deploy/native/*.sh
      - run: shellcheck install.sh scripts/agent-hub scripts/lib/*.sh scripts/commands/*.sh deploy/native/*.sh
      - name: Run bats tests/install
        shell: bash
        run: |
          set +e
          bats tests/install 2>&1 | tee bats-output.txt
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            python - <<'PY'
          from pathlib import Path

          output = Path("bats-output.txt").read_text(encoding="utf-8", errors="replace")
          detail = output[-3500:].strip() or "bats tests/install failed without captured output"
          detail = detail.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error file=tests/install,title=bats failure::{detail}")
          PY
          fi
          exit "$status"
      - run: docker compose -f deploy/compose/docker-compose.yml config --quiet
