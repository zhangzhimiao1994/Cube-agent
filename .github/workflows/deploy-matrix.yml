name: deploy-matrix

on:
  workflow_dispatch:
  push:
    tags:
      - 'harness-stage-*'

jobs:
  compose:
    runs-on: ubuntu-24.04
    env:
      AGENT_HUB_PUBLIC_URL: https://agent.example.test
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f deploy/compose/docker-compose.yml config --quiet
      - run: bash tests/install/smoke.sh --mode docker --dry-run

  native-detect:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        distro: [ubuntu, debian, rocky, almalinux]
    env:
      AGENT_HUB_INSTALL_ROOT: ${{ runner.temp }}/native-detect-${{ matrix.distro }}/opt
      AGENT_HUB_CONFIG_DIR: ${{ runner.temp }}/native-detect-${{ matrix.distro }}/etc
      AGENT_HUB_STATE_DIR: ${{ runner.temp }}/native-detect-${{ matrix.distro }}/state
      AGENT_HUB_PUBLIC_URL: https://agent.example.test
    steps:
      - uses: actions/checkout@v4
      - run: bash deploy/native/install-packages.sh --detect tests/install/fixtures/os-release-${{ matrix.distro }}
      - run: env AGENT_HUB_TEST=1 bash install.sh --mode auto --dry-run --yes

